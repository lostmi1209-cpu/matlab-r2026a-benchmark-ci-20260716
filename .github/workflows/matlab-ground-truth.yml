name: MATLAB benchmark Ground Truth

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matlab-ground-truth-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-score:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MATLAB and cross-disciplinary toolboxes
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2026a
          products: >-
            Statistics_and_Machine_Learning_Toolbox
            Optimization_Toolbox
            Signal_Processing_Toolbox

      - name: Generate Ground Truth and self-evaluate
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath("benchmark_records/ci");
            run_all_ground_truth;
            run_self_evaluation

      - name: Upload Ground Truth, MATLAB traces, and scores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-benchmark-ground-truth
          path: benchmark_records/records/*/ground_truth/output/
          if-no-files-found: error
          retention-days: 3
